name: CI Workflow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t vowel-frequency-analyzer:latest .
      - name: Run Docker container
        run: docker run --rm -v "$PWD:/app" -e GITHUB_USER="${{ github.actor }}" vowel-frequency-analyzer:latest
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README with vowel frequency results" || echo "No changes"
          git push
